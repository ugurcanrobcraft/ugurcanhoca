<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft AI - Kodlama Eğitmeni</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0f19; color: #f8fafc; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 700px; height: 100%; background: #1e293b; padding: 15px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
        h1 { color: #38bdf8; text-align: center; font-size: 20px; margin: 0 0 5px 0; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 12px; margin-bottom: 10px; }
        
        .settings-panel { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        select, input { background: #334155; border: none; color: white; padding: 6px; border-radius: 6px; font-size: 12px; width: 60%; }
        
        /* Dil Seçim Butonları (Güncellendi) */
        .lang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .lang-btn { background: #334155; color: white; border: none; padding: 8px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .lang-btn:hover { background: #0284c7; }

        /* Sohbet Alanı */
        .chat-box { flex: 1; background: #0f172a; border-radius: 8px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; border: 1px solid #334155; }
        .message { padding: 10px; border-radius: 8px; max-width: 85%; line-height: 1.4; font-size: 13px; word-wrap: break-word; }
        .user-msg { background: #0284c7; color: white; align-self: flex-end; }
        .ai-msg { background: #334155; color: #f8fafc; align-self: flex-start; }
        
        /* Alt Mesaj Yazma Paneli */
        .input-area { display: flex; gap: 6px; }
        .input-area input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #334155; color: white; font-size: 13px; width: auto; }
        .input-area button { background: #16a34a; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        pre { background: #1e293b; padding: 8px; border-radius: 4px; overflow-x: auto; color: #f472b6; font-family: monospace; }
        code { background: #1e293b; padding: 2px 4px; border-radius: 3px; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 CodeCraft AI Studio</h1>
        <div class="subtitle">İnteraktif Yazılım ve Kodlama Eğitmeni</div>

        <!-- Üst Ayar Paneli -->
        <div class="settings-panel">
            <div class="setting-row">
                <label>🤖 AI Modeli:</label>
                <select id="aiModel" onchange="modelDegisti()">
                    <option value="openai">ChatGPT (GPT-4o-mini)</option>
                    <option value="gemini">Gemini (3.5 Flash-Lite)</option>
                    <option value="anthropic">Claude (3.5 Sonnet)</option>
                    <option value="xai">Grok (xAI / OpenRouter)</option>
                </select>
            </div>
            <div class="setting-row">
                <label id="keyLabel">🔑 API Key Girin:</label>
                <input type="password" id="apiKey" placeholder="Seçilen modelin anahtarı zorunludur...">
            </div>
        </div>

        <!-- Odak Dil Seçimi -->
        <div class="lang-grid">
            <button class="lang-btn" onclick="dilSec('HTML')">HTML</button>
            <button class="lang-btn" onclick="dilSec('CSS')">CSS</button>
            <button class="lang-btn" onclick="dilSec('JavaScript')">JavaScript</button>
            <button class="lang-btn" onclick="dilSec('Python')">Python</button>
            <button class="lang-btn" onclick="dilSec('C++')">C++</button>
            <button class="lang-btn" onclick="dilSec('C#')">C#</button>
        </div>

        <!-- Sohbet Geçmişi -->
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">👋 Selam! Modelini seçip API anahtarını girdikten sonra yukarıdan bir programlama dili seç ve öğrenmeye başla! Sana sıfırdan profesyonel düzeyde kodlama öğreteceğim.</div>
        </div>

        <!-- Mesaj Gönderme Alanı -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Kodlama ile ilgili bir şey sor veya ders iste..." onkeypress="if(event.key === 'Enter') mesajGonder()">
            <button onclick="mesajGonder()">Gönder</button>
        </div>
    </div>

    <script>
        let aktifDil = "Genel";

        function modelDegisti() {
            const model = document.getElementById('aiModel').value;
            const label = document.getElementById('keyLabel');
            if(model === 'openai') label.innerText = "🔑 OpenAI Key:";
            else if(model === 'gemini') label.innerText = "🔑 Gemini Key:";
            else if(model === 'anthropic') label.innerText = "🔑 Claude Key:";
            else if(model === 'xai') label.innerText = "🔑 Grok Key:";
        }

        function dilSec(dil) {
            aktifDil = dil;
            mesajEkle(`Sistem: <b>${dil}</b> odak modu aktif! Artık bu dille ilgili sorularını sorabilir veya sıfırdan ders isteyebilirsin.`, 'ai-msg');
        }

        function mesajEkle(metin, sinif) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${sinif}`;
            div.innerHTML = metin;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        const SYSTEM_PROMPT = `Sen kıdemli, sabırlı ve elit bir yazılım eğiticisisin. Kullanıcıya seçtiği programlama dili (HTML, CSS, JavaScript, Python, C++, C#) hakkında asla geçiştirmeyen, derinlemesine, açıklayıcı, profesyonel kod örnekleri ve pratik ipuçları içeren harika interaktif dersler veriyorsun.
        Önemli Kurallar:
        1. Yanıtlarını düzgün HTML formatında (<b>, <p>, <code>, <pre> etiketleri kullanarak) ver. Markdown üç tırnak bloğu yerine <pre><code> kullan.
        2. Arkadaş canlısı, yönlendirici ve net ol. Kullanıcının sorduğu kodlama sorularını sabırla yanıtla ve mantığını açıkla.`;

        async function mesajGonder() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelSecimi = document.getElementById('aiModel').value;
            const input = document.getElementById('userInput');
            const kullaniciMesaji = input.value.trim();

            if(!apiKey) {
                alert(`⚠️ Lütfen seçtiğiniz model (${modelSecimi.toUpperCase()}) için API anahtarınızı girin!`);
                return;
            }
            if(!kullaniciMesaji) return;

            mesajEkle(kullaniciMesaji, 'user-msg');
            input.value = "";

            const bekletmeId = "loading_" + Date.now();
            const chatBox = document.getElementById('chatBox');
            const loadDiv = document.createElement('div');
            loadDiv.id = bekletmeId;
            loadDiv.className = "message ai-msg";
            loadDiv.innerText = "⚡ Yapay Zeka düşünüyor ve kod yazıyor...";
            chatBox.appendChild(loadDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            let aiCevap = "";

            try {
                const tamPrompt = `${SYSTEM_PROMPT}\n\nÖğrencinin Seçtiği Odak Dil: ${aktifDil}\nÖğrencinin Mesajı / İsteği: ${kullaniciMesaji}`;

                if (modelSecimi === 'openai') {
                    const res = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "gpt-4o-mini",
                            messages: [{ role: "user", content: tamPrompt }],
                            temperature: 0.7
                        })
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    aiCevap = data.choices[0].message.content;

                } else if (modelSecimi === 'gemini') {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: tamPrompt }] }],
                            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
                        })
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    aiCevap = data.candidates[0].content.parts[0].text;

                } else if (modelSecimi === 'anthropic') {
                    const res = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json", 
                            "x-api-key": apiKey,
                            "anthropic-version": "2023-06-01",
                            "anthropic-dangerous-direct-browser-access": "true"
                        },
                        body: JSON.stringify({
                            model: "claude-3-5-sonnet-20241022",
                            max_tokens: 1500,
                            system: SYSTEM_PROMPT,
                            messages: [{ role: "user", content: `Odak Dil: ${aktifDil} - İstek: ${kullaniciMesaji}` }]
                        })
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    aiCevap = data.content[0].text;

                } else if (modelSecimi === 'xai') {
                    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "x-ai/grok-2",
                            messages: [
                                { role: "system", content: SYSTEM_PROMPT },
                                { role: "user", content: `Odak Dil: ${aktifDil} - İstek: ${kullaniciMesaji}` }
                            ]
                        })
                    });
                    const data = await res.json();
                    if(data.error) throw new Error(data.error.message);
                    aiCevap = data.choices[0].message.content;
                }

                document.getElementById(bekletmeId).remove();
                mesajEkle(aiCevap, 'ai-msg');

            } catch (err) {
                document.getElementById(bekletmeId).remove();
                mesajEkle(`❌ Hata oluştu: ${err.message}`, 'ai-msg');
            }
        }
    </script>
</body>
</html>
